[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "LiFT"
version = "0.1.0"
description = "Live Foci Tracking pipeline"
requires-python = ">=3.9"
dependencies = [
    "numpy==2.0.2",
    "scipy==1.17.1",
    "scikit-image==0.26.0",
    "matplotlib==3.10.9",
    "tifffile==2026.4.11",
    "imagecodecs==2026.3.6",
    "imageio==2.37.3",
    "pyyaml==6.0.3",
    "natsort==8.4.0",
    "tqdm==4.67.3",
    "pystackreg==0.2.8",
    "roifile==2026.2.10",
    "networkx",
]

[project.optional-dependencies]
cp-sam     = ["cellpose>=4.0"]
cp-v3      = ["cellpose>=3.0,<4.0"]
trackastra = ["trackastra"]
spotiflow  = ["spotiflow"]
elastix    = ["itk-elastix"]
notebook   = ["jupyter"]
app        = ["flask==3.1.3"]

[project.scripts]
lift = "lift.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lift"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build.force-include]
"src/lift/elastix_params" = "lift/elastix_params"