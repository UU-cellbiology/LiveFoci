[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "LiFT"
version = "0.1.0"
description = "Live Foci Tracking pipeline"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.20",
    "matplotlib>=3.7",
    "tifffile>=2023.1",
    "imagecodecs>=2023.1",
    "imageio>=2.28",
    "pyyaml>=6.0",
    "natsort>=8.3",
    "tqdm>=4.64",
    "pystackreg>=0.2.7",
    "roifile>=2023.1",
    "networkx>=3.0",
    "torch>=1.9"
]

[project.optional-dependencies]
cp-sam     = ["cellpose>=4.0"]
cp-v3      = ["cellpose>=3.0,<4.0"]
trackastra = ["trackastra>=0.2"]
spotiflow  = ["spotiflow>=0.4"]
elastix    = ["itk-elastix>=5.3"]
notebook   = ["jupyter"]
app        = ["flask>=3.0"]

[project.scripts]
lift = "lift.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lift"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build.force-include]
"src/lift/elastix_params" = "lift/elastix_params"