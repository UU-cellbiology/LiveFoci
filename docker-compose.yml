version: "3.9"

services:

  # ── maintainer-only: builds the images that get pushed to Docker Hub ──────
  # Most users never touch this profile.
  cpu-base:
    build:
      context: .
      dockerfile: Dockerfile.base
      args:
        BASE_IMAGE: python:3.11-slim
    image: <dockerhub-user>/lift:cpu-base
    profiles: [build-base]

  gpu-base:
    build:
      context: .
      dockerfile: Dockerfile.base
      args:
        BASE_IMAGE: nvidia/cuda:12.1.0-runtime-ubuntu22.04
    image: <dockerhub-user>/lift:gpu-base
    profiles: [build-base]

  # ── everyone else: build your own combo on top of a published base ────────
  # Fast — the base is pulled once and cached; this just adds one pip layer.
  # Any EXTRAS combination works, not just a fixed preset.
  custom:
    build:
      context: .
      args:
        BASE: ${BASE:-<dockerhub-user>/lift:cpu-base}
        EXTRAS: ${EXTRAS:-}
    image: lift-custom
    volumes:
      - ./data:/data
    profiles: [custom]